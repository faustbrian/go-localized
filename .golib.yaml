schema_version: 1
tool_version: v1.0.13
tool_checksums_sha256: 164e5c8abefe655958f522677856816faddbd2a8d40eba7d37ba5a031210df70

manifest:
  modules: modules.json
  packages: packages.json

evidence:
  root: .verification

mutation:
  root: .verification/mutation
  imports:
    - module: .
      archive: .verification/mutation/bootstrap/root.zip
      ledger: .verification/mutation/migration-ledger.json

api:
  baselines:
    - module: .
      mode: apidiff
      path: api/baseline.txt

operations:
  - module: .
    gate: conformance
    steps:
      - type: make
        makefile: verification/package.mk
        target: standards
        timeout: 20m
  - module: .
    gate: test
    steps:
      - type: make
        makefile: verification/package.mk
        target: standards
        timeout: 20m
  - module: .
    gate: docs
    steps:
      - type: make
        makefile: verification/package.mk
        target: docs
        timeout: 20m
  - module: .
    gate: fuzz
    steps:
      - type: go-test
        packages: [.]
        fuzz: '^FuzzDecodeJSON$'
        budget: 2s
        timeout: 2m
      - type: go-test
        packages: [.]
        fuzz: '^FuzzTextProperties$'
        budget: 2s
        timeout: 2m
      - type: go-test
        packages: [./encoding]
        fuzz: '^FuzzUnmarshalEntries$'
        budget: 2s
        timeout: 2m
      - type: go-test
        packages: [./http]
        fuzz: '^FuzzParseAcceptLanguage$'
        budget: 2s
        timeout: 2m
      - type: go-test
        packages: [./localizedwire]
        fuzz: '^FuzzWireDecoders$'
        budget: 2s
        timeout: 2m
      - type: go-test
        packages: [./match]
        fuzz: '^FuzzFallbackPlan$'
        budget: 2s
        timeout: 2m
      - type: go-test
        packages: [./postgres]
        fuzz: '^FuzzPGXJSONBCodec$'
        budget: 2s
        timeout: 2m
      - type: go-test
        packages: [./postgres]
        fuzz: '^FuzzSQLScan$'
        budget: 2s
        timeout: 2m
  - module: .
    gate: benchmark
    steps:
      - type: go-test
        packages: [./...]
        benchmark: .
        budget: 100ms
        timeout: 20m
